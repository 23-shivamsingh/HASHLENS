name: Test HASHLENS
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python detection tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Browser engine tests
        run: node --test web/tests/*.test.mjs tests/parity.mjs
      - name: Syntax checks
        run: |
          python -m py_compile hash_identifier.py
          node --check web/app.js
          node --check web/engine.mjs
