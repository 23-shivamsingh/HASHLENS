[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hashlens-cli"
version = "1.0.0"
description = "HASHLENS: local hash signature identification CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [{name = "HASHLENS contributors"}]
maintainers = [{name = "Shivam Singh"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Environment :: Console",
]

[project.scripts]
hashlens = "hash_identifier:main"

[tool.setuptools]
py-modules = ["hash_identifier"]
